<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AD0-E726 Flashcards</title>
<style>
  :root {
    --bg:#0b1120; --panel:#162033; --panel2:#1d2a42; --line:#2a3955;
    --text:#e6edf7; --muted:#8fa0b8; --accent:#38bdf8; --ok:#22c55e; --bad:#f87171; --warn:#fbbf24;
    --code:#0f172a;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f1f5f9; --panel:#ffffff; --panel2:#f8fafc; --line:#e2e8f0; --text:#0f172a; --muted:#64748b; --code:#f1f5f9; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { min-height:100dvh; display:flex; flex-direction:column; }

  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:calc(10px + env(safe-area-inset-top)) 16px 8px; border-bottom:1px solid var(--line); }
  .top { display:flex; align-items:center; justify-content:space-between; gap:8px; max-width:760px; margin:0 auto; }
  h1 { font-size:17px; margin:0; font-weight:700; }
  .stats { font-size:13px; color:var(--muted); white-space:nowrap; }
  .progress { height:4px; background:var(--line); border-radius:2px; margin:8px auto 10px; overflow:hidden; max-width:760px; }
  .progress div { height:100%; width:0; background:var(--ok); transition:width .3s; }
  .chips { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; max-width:760px; margin:0 auto; padding-bottom:2px; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#04121f; font-weight:600; }

  main { flex:1; width:100%; max-width:760px; margin:0 auto; padding:14px 14px calc(96px + env(safe-area-inset-bottom)); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 6px 24px rgba(0,0,0,.18); }
  .meta { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .tag { font-size:11px; letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:6px; background:var(--panel2); color:var(--accent); border:1px solid var(--line); }
  .tag.sample { color:var(--warn); }
  .q { font-size:20px; font-weight:650; line-height:1.35; margin:0; }
  .reveal { width:100%; margin-top:18px; padding:14px; border-radius:12px; border:1px dashed var(--accent); background:transparent; color:var(--accent); font-size:16px; font-weight:600; cursor:pointer; }
  .answer { display:none; margin-top:16px; }
  .card.open .answer { display:block; animation:fade .25s ease; }
  .card.open .reveal { display:none; }
  @keyframes fade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  .label { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:14px 0 6px; font-weight:600; }
  .label:first-child { margin-top:0; }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; background:var(--code); border:1px solid var(--line); border-radius:10px; padding:12px; font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .why { margin:0; color:var(--text); font-size:15px; }
  .source { margin-top:16px; padding-top:12px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); }
  .source a { color:var(--accent); text-decoration:none; word-break:break-word; }
  .source div + div { margin-top:4px; }

  .done { text-align:center; padding:48px 16px; }
  .done button { margin-top:16px; }

  footer { position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--bg); border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .grade { display:flex; gap:10px; max-width:760px; margin:0 auto; }
  .grade button, .done button { flex:1; padding:15px; border-radius:12px; font-size:16px; font-weight:650; cursor:pointer; border:0; }
  .again { background:rgba(248,113,113,.15); color:var(--bad); border:1px solid var(--bad) !important; }
  .good { background:var(--ok); color:#04210f; }
  .done button { background:var(--accent); color:#04121f; flex:none; padding:12px 22px; }
  .grade button:disabled { opacity:.35; }
  .tools { display:flex; justify-content:center; gap:16px; margin-top:14px; font-size:13px; }
  .tools button { background:none; border:0; color:var(--muted); text-decoration:underline; cursor:pointer; font-size:13px; }
  .keys { display:none; text-align:center; color:var(--muted); font-size:12px; margin-top:10px; }
  @media (hover:hover) and (min-width:700px) { .keys { display:block; } .q { font-size:22px; } .card { padding:24px; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>AD0-E726 Front-End</h1>
    <div class="stats" id="stats"></div>
  </div>
  <div class="progress"><div id="bar"></div></div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <div id="stage"></div>
  <div class="tools"><button id="shuffle">Shuffle</button><button id="reset">Reset progress</button></div>
  <div class="keys">Space = show answer · 1 = again · 2 = got it</div>
</main>

<footer>
  <div class="grade">
    <button class="again" id="btnAgain" disabled>Again</button>
    <button class="good" id="btnGood" disabled>Got it</button>
  </div>
</footer>

<script>
const FE = 'https://developer.adobe.com/commerce/frontend-core/';
const EL = 'https://experienceleague.adobe.com/en/docs/';
const ELO = EL + 'commerce-operations/configuration-guide/';
const ELA = EL + 'commerce-admin/';

const SRC = {
  create:    ['Frontend Developer Guide › Create a storefront theme', FE + 'guide/themes/create-storefront'],
  structure: ['Frontend Developer Guide › Theme structure', FE + 'guide/themes/structure'],
  inherit:   ['Frontend Developer Guide › Theme inheritance', FE + 'guide/themes/inheritance'],
  configure: ['Frontend Developer Guide › Configure theme properties', FE + 'guide/themes/configure'],
  dict:      ['Frontend Developer Guide › Use a dictionary to customize strings', FE + 'guide/translations/dictionary'],
  strings:   ['Frontend Developer Guide › Theme strings', FE + 'guide/translations/theory'],
  ltypes:    ['Frontend Developer Guide › Layout file types', FE + 'guide/layouts/types'],
  linstr:    ['Frontend Developer Guide › Layout instructions', FE + 'guide/layouts/xml-instructions'],
  ltasks:    ['Frontend Developer Guide › Common layout customization tasks', FE + 'guide/layouts/xml-manage'],
  lextend:   ['Frontend Developer Guide › Extend a layout', FE + 'guide/layouts/extend'],
  loverride: ['Frontend Developer Guide › Override a layout', FE + 'guide/layouts/override'],
  lcreate:   ['Frontend Developer Guide › Create a new layout', FE + 'guide/layouts/create'],
  tbasic:    ['Frontend Developer Guide › Templates basic concepts', FE + 'guide/templates/override'],
  email:     ['Frontend Developer Guide › Email templates', FE + 'guide/templates/email'],
  xss:       ['PHP Developer Guide › Cross-site scripting (XSS)', 'https://developer.adobe.com/commerce/php/development/security/cross-site-scripting'],
  cstyles:   ['Frontend Developer Guide › Customize theme styles', FE + 'guide/css/quickstart/customize-styles'],
  cmode:     ['Frontend Developer Guide › Compilation mode', FE + 'guide/css/quickstart/compilation-mode'],
  cpre:      ['Frontend Developer Guide › CSS and LESS preprocessing', FE + 'guide/css/preprocess'],
  cui:       ['Frontend Developer Guide › UI library', FE + 'guide/css/ui-library'],
  cinc:      ['Frontend Developer Guide › Include CSS', FE + 'guide/css/themes'],
  grunt:     ['Frontend Developer Guide › Compile LESS with Grunt', FE + 'guide/css/debug'],
  rjs:       ['JavaScript Developer Guide › RequireJS in Commerce', FE + 'javascript/requirejs'],
  mixins:    ['JavaScript Developer Guide › JavaScript mixins', FE + 'javascript/mixins'],
  init:      ['JavaScript Developer Guide › Call and initialize JavaScript', FE + 'javascript/init'],
  custom:    ['JavaScript Developer Guide › Custom JavaScript', FE + 'javascript/custom'],
  widgets:   ['JavaScript Developer Guide › jQuery widgets', FE + 'javascript/jquery-widgets/'],
  kob:       ['UI Components Guide › Custom Knockout.js bindings', FE + 'ui-components/concepts/knockout-bindings'],
  bsyn:      ['UI Components Guide › Binding syntax', FE + 'ui-components/concepts/binding-syntax'],
  scd:       ['Configuration Guide › Static view file deployment', ELO + 'cli/static-view/static-view-file-deployment'],
  cache:     ['Configuration Guide › Manage the cache', ELO + 'cli/manage-cache'],
  modes:     ['Configuration Guide › Application modes', ELO + 'setup/application-modes'],
  setmode:   ['Configuration Guide › Set the mode', ELO + 'cli/set-mode'],
  dconf:     ['Admin Guide › Design configuration', ELA + 'content-design/design/configuration'],
  themes:    ['Admin Guide › Themes', ELA + 'content-design/design/themes/themes'],
  sched:     ['Admin Guide › Schedule design changes', ELA + 'content-design/design/themes/schedule'],
  catdesign: ['Admin Guide › Categories – Design settings', ELA + 'catalog/categories/create/categories-custom-design'],
  proddesign:['Admin Guide › Products – Design settings', ELA + 'catalog/products/settings/settings-advanced-design'],
  pageadd:   ['Admin Guide › Add a new page', ELA + 'content-design/elements/pages/page-add'],
  emailadmin:['Admin Guide › Customize email templates', ELA + 'systems/communications/email-template-custom'],
  cloudvars: ['Commerce on Cloud › Build variables', EL + 'commerce-cloud-service/user-guide/configure/env/stage/variables-build'],
  cloudcli:  ['Commerce on Cloud › Cloud CLI overview', EL + 'commerce-cloud-service/user-guide/dev-tools/cloud-cli/cloud-cli-overview'],
  ece:       ['Commerce on Cloud › ece-tools package', EL + 'commerce-cloud-service/user-guide/dev-tools/ece-tools/package-overview'],
};
const SAMPLE_URL = 'https://www.edusum.com/adobe/adobe-commerce-front-end-developer-professional-ad0-e726-certification-sample-questions';

const SECTIONS = {
  1: 'Theme management (16%)',
  2: 'Layout XML & templates (23%)',
  3: 'Styles (19%)',
  4: 'JavaScript (20%)',
  5: 'Admin configuration (12.4%)',
  6: 'CLI (9.6%)',
};

// s = exam section, q, a, why, src = [source key, doc section heading], sample = also asked in the sample questions
const CARDS = [
  // Section 1
  {s:1, sample:true, q:"Where do you create a new storefront theme?", a:"app/design/frontend/<Vendor>/<theme>",
   why:"Themes live in app/design. pub/static is generated output and vendor/ is for Composer packages, so both are wrong answers.", src:['create','Create a theme directory']},
  {s:1, sample:true, q:"Which TWO files are required to create a theme?", a:"theme.xml\nregistration.php\n\n(NOT composer.json, NOT etc/view.xml)",
   why:"theme.xml declares the theme and registration.php registers it. composer.json is only needed to distribute it as a package; view.xml is optional.", src:['create','Declare your theme / Add registration.php']},
  {s:1, q:"What goes in theme.xml?", a:"<title>My Theme</title>\n<parent>Magento/luma</parent>\n<media><preview_image>media/preview.jpg</preview_image></media>",
   why:"Only the title is mandatory. <parent> turns on inheritance; the preview image is shown in the admin.", src:['create','Declare your theme']},
  {s:1, q:"registration.php for a theme?", a:"ComponentRegistrar::register(\n  ComponentRegistrar::THEME,\n  'frontend/Vendor/theme',\n  __DIR__\n);",
   why:"Same registrar as modules, but with the THEME type and an area-prefixed name (frontend/…).", src:['create','Add registration.php']},
  {s:1, q:"A theme with no <parent> in theme.xml is…?", a:"A top-level theme (like Magento/blank). Luma's parent is Magento/blank.",
   why:"Without a parent there is no fallback to another theme, only to module and library files.", src:['inherit','Set a parent theme']},
  {s:1, q:"Extend Magento_Theme's 1column page layout in a theme — path?", a:"<theme>/Magento_Theme/page_layout/1column.xml",
   why:"Theme paths mirror the module's view/frontend folder without the 'view/frontend' part.", src:['lextend','Extend a layout']},
  {s:1, q:"Override Magento_Catalog's view/frontend/templates/product/list.phtml in a theme?", a:"<theme>/Magento_Catalog/templates/product/list.phtml\n\n(drop 'view/frontend' from the path)",
   why:"Template fallback checks the theme's <Vendor_Module>/templates folder before the module.", src:['tbasic','Template overrides']},
  {s:1, sample:true, q:"Override Magento_Checkout's view/frontend/web/template/summary.html in a theme?", a:"<theme>/Magento_Checkout/web/template/summary.html",
   why:"Knockout .html templates are static files, so they live under web/ — keep the same 'web/template' path inside the theme.", src:['inherit','Override static assets']},
  {s:1, q:"Template fallback order?", a:"child theme → parent theme → module view/frontend → module view/base",
   why:"Magento uses the first match it finds, so the closest theme wins.", src:['inherit','Override templates']},
  {s:1, q:"Where are product image sizes configured?", a:"<theme>/etc/view.xml\n<images module=\"Magento_Catalog\">\n  <image id=\"category_page_grid\" type=\"small_image\">\n    <width>240</width><height>300</height>",
   why:"view.xml holds theme-level image and gallery settings; the image id is what templates ask for.", src:['configure','Configure image properties']},
  {s:1, q:"Command to regenerate resized product images?", a:"bin/magento catalog:images:resize",
   why:"After changing sizes in view.xml, existing cached images keep the old size until regenerated.", src:['configure','Resize catalog images']},
  {s:1, q:"Where does a theme keep its translations?", a:"<theme>/i18n/<locale>.csv  e.g. i18n/en_US.csv\nFormat: \"Original\",\"Translated\"",
   why:"en_US.csv works too — it's how you rename default English strings.", src:['dict','Override parent strings for default locale']},
  {s:1, q:"Translation priority, lowest → highest?", a:"module i18n → language package → parent theme → child theme → database (inline translation)",
   why:"The docs: module translations have the lowest priority and the database the highest.", src:['dict','How the application applies locales']},
  {s:1, q:"Two strings compete: parent theme vs child theme csv. Who wins?", a:"Child theme. And DB (inline) translations beat both.",
   why:"Docs: \"child theme translations have priority over parent theme translations.\"", src:['dict','How the application applies locales']},
  {s:1, q:"How do you mark a string translatable in phtml / layout XML / email?", a:"phtml: __('Text')\nlayout: <argument ... translate=\"true\">\nemail: {{trans \"Text\"}}",
   why:"Each file type has its own syntax; the phrase collector finds all three.", src:['strings','Theme strings']},
  {s:1, q:"Where to enable inline translation?", a:"Stores > Configuration > Advanced > Developer > Translate Inline\n(Developer tab visible only in developer mode)",
   why:"Inline translations are saved to the database — the highest translation priority.", src:['dict','How the application applies locales']},

  // Section 2
  {s:2, sample:true, q:"Correct XML to remove a block?", a:"<referenceBlock name=\"block.name\" remove=\"true\"/>\n\nTraps: <remove element=\"\"/>, action=\"remove\" — don't exist",
   why:"Blocks and containers are removed with the remove attribute; the <remove> element is only for head assets.", src:['linstr','referenceBlock and referenceContainer']},
  {s:2, q:"remove=\"true\" vs display=\"false\"?", a:"remove: element + children deleted from the layout\ndisplay=\"false\": not rendered, but still exists (can be moved/referenced)",
   why:"Docs: display=false prevents displaying, but the PHP classes are still loaded.", src:['linstr','block / referenceBlock']},
  {s:2, q:"Move a block into another container, as the first child?", a:"<move element=\"x\" destination=\"y\" before=\"-\"/>",
   why:"move keeps the element and its children; before/after set the position in the new parent.", src:['linstr','move']},
  {s:2, q:"before=\"-\" / after=\"-\" mean?", a:"before=\"-\" = first in parent\nafter=\"-\" = last in parent",
   why:"A dash means 'all siblings' instead of naming one.", src:['linstr','before and after attributes']},
  {s:2, q:"What does <remove src=\"...\"/> do?", a:"Removes a static asset (css/js) added in <head>. Only for head assets, not blocks.",
   why:"Docs: <remove> is used only to remove static resources linked in the page <head>.", src:['linstr','remove']},
  {s:2, q:"Include another handle in a layout file?", a:"<update handle=\"customer_account\"/>",
   why:"Pulls in all instructions of that handle, like an include.", src:['linstr','update']},
  {s:2, sample:true, q:"Extend Magento_Customer/view/frontend/layout/customer_account.xml in a theme?", a:"<theme>/Magento_Customer/layout/customer_account.xml\n(merged with the original)",
   why:"A same-named file in the theme is merged on top of the module's, so you only add changes.", src:['lextend','Extend a layout']},
  {s:2, q:"OVERRIDE (replace) a module's layout file in a theme?", a:"<theme>/Magento_Customer/layout/override/base/customer_account.xml",
   why:"'override/base' replaces the module's file completely instead of merging.", src:['loverride','Override base layouts']},
  {s:2, q:"Override a PARENT THEME's layout file?", a:"<theme>/Magento_Customer/layout/override/theme/Magento/luma/customer_account.xml",
   why:"'override/theme/<Vendor>/<theme>' targets one specific parent theme's file.", src:['loverride','Override theme layouts']},
  {s:2, q:"Extend vs override layout — which is preferred?", a:"Extend (merge). Overriding replaces the whole file and breaks on upgrades.",
   why:"The docs list overriding as a last resort; extending keeps upstream changes.", src:['loverride','Customization mistakes']},
  {s:2, q:"Name the frontend page layouts.", a:"empty, 1column, 2columns-left, 2columns-right, 3columns",
   why:"empty is in Magento_Theme view/base; the others in view/frontend/page_layout.", src:['ltypes','Page layout']},
  {s:2, q:"Add a custom page layout in a theme — which files?", a:"<theme>/Magento_Theme/page_layout/my-layout.xml\n<theme>/Magento_Theme/layouts.xml  (declares it so admin shows it)",
   why:"Without the layouts.xml entry the layout works but doesn't appear in admin dropdowns.", src:['lcreate','Add the layout to the layouts.xml file']},
  {s:2, q:"Page layout vs page configuration file?", a:"Page layout (page_layout/): containers only, the skeleton\nPage configuration (layout/): <page> with <head> and <body>, blocks",
   why:"Page layouts define structure; page configurations fill it with content.", src:['ltypes','Page layout / Page configuration']},
  {s:2, q:"Generic layout file?", a:"Root <layout>, no head/body. Used for AJAX/partial responses.",
   why:"Used when the response is an HTML fragment, not a full page.", src:['ltypes','Generic layout']},
  {s:2, q:"Handle for the product page? For one specific product?", a:"catalog_product_view (route_controller_action)\ncatalog_product_view_id_42, _type_simple, _sku_<sku>",
   why:"Page-type handles follow route_controller_action; page-specific handles add an id/type suffix.", src:['ltypes','Page configuration']},
  {s:2, q:"Handle loaded on every page?", a:"default",
   why:"default.xml is where site-wide header/footer changes go.", src:['ltasks','Common customization tasks']},
  {s:2, q:"Container vs block?", a:"Container: only wraps children (htmlTag, htmlClass, htmlId); empty = not rendered.\nBlock: has a class + template, renders content.",
   why:"Docs: an empty container with no child blocks is not rendered.", src:['linstr','block vs. container']},
  {s:2, q:"What does cacheable=\"false\" on a block do?", a:"Makes the WHOLE page uncacheable by full page cache. Avoid.",
   why:"One uncacheable block disables FPC for every page that uses that layout.", src:['linstr','block']},
  {s:2, q:"Pass data to a block from layout XML?", a:"<arguments>\n  <argument name=\"title\" xsi:type=\"string\" translate=\"true\">Hi</argument>\n</arguments>\nRead: $block->getData('title') / $block->getTitle()",
   why:"Arguments become block data, readable by the magic getter.", src:['linstr','argument']},
  {s:2, q:"Argument xsi:type values?", a:"string, boolean, number, null, array, object, url, options, helper, const",
   why:"The type decides how the value is interpreted (object = class instance).", src:['linstr','argument']},
  {s:2, q:"Pass a view model to a template?", a:"<argument name=\"view_model\" xsi:type=\"object\">Vendor\\Module\\ViewModel\\X</argument>\nClass implements ArgumentInterface",
   why:"View models keep logic out of templates without a custom block class.", src:['tbasic','Getting argument values from layout']},
  {s:2, q:"Change a block's template in layout?", a:"<referenceBlock name=\"x\" template=\"Vendor_Module::new.phtml\"/>",
   why:"The template attribute on referenceBlock swaps the template file.", src:['ltasks','Set the template used by a block']},
  {s:2, q:"Which escaper for text inside an HTML element?", a:"$escaper->escapeHtml($value)\n(optionally allowed tags: escapeHtml($v, ['b','a']))",
   why:"Escape for the context where the value is printed.", src:['xss','Output Processing › PHTML templates']},
  {s:2, q:"Which escaper for an HTML attribute?", a:"$escaper->escapeHtmlAttr($value)",
   why:"Attributes need quotes escaped too, which escapeHtml alone doesn't guarantee.", src:['xss','Output Processing › PHTML templates']},
  {s:2, q:"Which escaper for href/src?", a:"$escaper->escapeUrl($url)",
   why:"Blocks javascript: and other unsafe URL schemes.", src:['xss','Output Processing › PHTML templates']},
  {s:2, q:"Which escaper inside inline JavaScript?", a:"$escaper->escapeJs($value)",
   why:"JavaScript strings need different escaping than HTML.", src:['xss','Output Processing › PHTML templates']},
  {s:2, q:"Mark intentional raw output in phtml?", a:"/* @noEscape */ $block->getChildHtml()\n($block->escape*() is deprecated → use $escaper)",
   why:"The static test flags unescaped output unless it's annotated.", src:['xss','Static Test']},
  {s:2, q:"Enable template hints?", a:"bin/magento dev:template-hints:enable",
   why:"Shows which template renders each block — handy for finding what to override.", src:['tbasic','Template location']},

  // Section 3
  {s:3, q:"Compiled vs partial LESS file — how to tell?", a:"No underscore = root, compiled to CSS (styles-m.less)\nUnderscore = partial, only imported (_module.less)",
   why:"Root source files are what layout references as .css.", src:['cpre','Terms used › Root source files']},
  {s:3, q:"styles-m.less vs styles-l.less?", a:"styles-m: mobile + common styles (all widths)\nstyles-l: desktop (min-width 768px)",
   why:"Mobile-first: everyone loads styles-m, desktop also loads styles-l.", src:['cinc','How stylesheet files are organized']},
  {s:3, q:"Easiest way to ADD styles on top of the parent theme?", a:"<theme>/web/css/source/_extend.less",
   why:"Docs: the simplest option when you're happy with the parent and just want more styles.", src:['cstyles','Extend parent styles']},
  {s:3, q:"What happens if a child theme creates _theme.less?", a:"It REPLACES the parent's _theme.less — copy Luma's content first or its variables are lost.",
   why:"Docs: \"your _theme.less overrides the parent _theme.less\" — copy all variables you need.", src:['cstyles','Override parent styles']},
  {s:3, q:"Change only theme variables (e.g. primary color)?", a:"<theme>/web/css/source/_theme.less (or _variables.less)\n@primary__color: #c00;",
   why:"Variables are overridden, not extended, so they go in _theme.less.", src:['cstyles','Override parent styles']},
  {s:3, q:"_extend.less vs _theme.less — which wins on conflict?", a:"_extend.less always takes precedence over _theme.less.",
   why:"Docs note: rules and variables in _extend.less override those in _theme.less.", src:['cstyles','Extend parent styles']},
  {s:3, q:"Replace a module's styles completely in a theme?", a:"<theme>/Magento_Catalog/web/css/source/_module.less",
   why:"Same name in the theme replaces the module's file via fallback.", src:['cstyles','Override module styles']},
  {s:3, q:"Extend a module's styles without replacing them?", a:"<theme>/Magento_Catalog/web/css/source/_extend.less\n(collected by //@magento_import)",
   why:"Module-level _extend.less files are gathered by @magento_import.", src:['cstyles','Extend module styles']},
  {s:3, q:"What does //@magento_import do?", a:"Magento directive: imports a file with that name from ALL modules/themes via fallback.\nLeading // hides it from the plain LESS compiler.",
   why:"Lets one root file pick up every module's _module.less without listing them.", src:['cpre','@magento_import directive']},
  {s:3, q:"Where is the Magento UI library?", a:"lib/web/css/source/lib/  (mixins like .lib-button(), .lib-font-face(), .lib-css())",
   why:"Blank and Luma are built from these mixins and variables.", src:['cui','Mixin location']},
  {s:3, q:"Write styles for ALL screen sizes (UI library pattern)?", a:"& when (@media-common = true) { ... }",

const KEY = 'ad0e726-progress-v2';
let progress = JSON.parse(localStorage.getItem(KEY) || '{}');
let filter = 'all', queue = [], current = null;

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save = () => localStorage.setItem(KEY, JSON.stringify(progress));
const inFilter = (c, i) => filter === 'all' ? true : filter === 'missed' ? progress[i] === 'again' : String(c.s) === filter;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function chips() {
  const missed = CARDS.filter((c, i) => progress[i] === 'again').length;
  const items = [['all', 'All'], ...Object.keys(SECTIONS).map(k => [k, 'S' + k + ' ' + SECTIONS[k].replace(/ \(.*/, '')]), ['missed', 'Missed (' + missed + ')']];
  $('chips').innerHTML = items.map(([k, l]) => `<button class="chip${k === filter ? ' on' : ''}" data-k="${k}">${esc(l)}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { filter = b.dataset.k; build(); });
}
function stats() {
  const ids = CARDS.map((c, i) => i).filter(i => filter === 'missed' || filter === 'all' || String(CARDS[i].s) === filter);
  const good = ids.filter(i => progress[i] === 'good').length;
  $('stats').textContent = `${good}/${ids.length} known`;
  $('bar').style.width = ids.length ? (good / ids.length * 100) + '%' : '0';
}
function build() {
  const pool = CARDS.map((c, i) => i).filter(i => inFilter(CARDS[i], i));
  queue = shuffle(filter === 'missed' ? pool : pool.filter(i => progress[i] !== 'good'));
  chips(); next();
}
function next() {
  stats();
  current = queue.shift();
  $('btnAgain').disabled = $('btnGood').disabled = true;
  if (current === undefined) {
    $('stage').innerHTML = `<div class="card done"><div style="font-size:40px">🎉</div><p>Nothing left in this set.</p><button id="again">Go through it again</button></div>`;
    $('again').onclick = () => { CARDS.forEach((c, i) => { if (inFilter(c, i)) delete progress[i]; }); save(); build(); };
    return;
  }
  const c = CARDS[current];
  const [title, url] = SRC[c.src[0]];
  $('stage').innerHTML = `
    <article class="card" id="card">
      <div class="meta">
        <span class="tag">S${c.s} · ${esc(SECTIONS[c.s].replace(/ \(.*/, ''))}</span>
        ${c.sample ? '<span class="tag sample">Sample exam question</span>' : ''}
      </div>
      <p class="q">${esc(c.q)}</p>
      <button class="reveal" id="reveal">Show answer</button>
      <div class="answer">
        <div class="label">Answer</div>
        <pre>${esc(c.a)}</pre>
        <div class="label">Why</div>
        <p class="why">${esc(c.why)}</p>
        <div class="source">
          <div>📘 Source: <a href="${url}" target="_blank" rel="noopener">${esc(title)}</a> › ${esc(c.src[1])}</div>
          <div>🎯 Exam objective: Section ${c.s} — ${esc(SECTIONS[c.s])}</div>
          ${c.sample ? `<div>📝 Also asked in the <a href="${SAMPLE_URL}" target="_blank" rel="noopener">AD0-E726 sample questions</a></div>` : ''}
        </div>
      </div>
    </article>`;
  $('reveal').onclick = reveal;
  window.scrollTo({ top: 0 });
}
function reveal() {
  const card = $('card');
  if (!card || card.classList.contains('open')) return;
  card.classList.add('open');
  $('btnAgain').disabled = $('btnGood').disabled = false;
}
function grade(g) {
  if (current === undefined || $('btnGood').disabled) return;
  progress[current] = g; save();
  if (g === 'again') queue.splice(Math.min(3, queue.length), 0, current);
  if (filter === 'missed' && g === 'good') { /* drops out of the missed set */ }
  chips(); next();
}
$('btnAgain').onclick = () => grade('again');
$('btnGood').onclick = () => grade('good');
$('shuffle').onclick = build;
$('reset').onclick = () => { if (confirm('Reset all progress?')) { progress = {}; save(); build(); } };
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); reveal(); }
  if (e.key === '1') grade('again');
  if (e.key === '2') grade('good');
});
build();
</script>
